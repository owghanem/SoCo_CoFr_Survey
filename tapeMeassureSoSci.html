<style>
	/* --- STYLES --- */
	#game-wrapper {
		max-width: 100%;
		background: #f9f9f9;
		border: 1px solid #ddd;
		border-radius: 8px;
		font-family: Arial, sans-serif;
		overflow: visible;
		/* Allow handle to go outside visually if needed */
	}

	.tape-container {
		position: relative;
		height: 80px;
		margin: 1rem;
		background: #eee;
		border: 1px solid #bbb;
		border-radius: 4px;
		margin-top: 20px;
		user-select: none;
		/* Crucial for dragging */
		touch-action: none;
		/* Crucial for mobile */
		overflow: hidden;
		/* 1. Ensure visuals stay inside the box */
	}

	/* The plastic housing */
	.tape-housing {
		position: absolute;
		left: 0;
		top: 17px;
		width: 60px;
		height: 47px;
		background: #e67e22;
		border-radius: 4px;
		z-index: 10;
	}

	/* The yellow tape */
	.tape-strip {
		position: absolute;
		left: 60px;
		top: 25px;
		height: 30px;
		width: 0px;
		background-color: #f1c40f;
		border: 1px solid #cfaa08;
		z-index: 5;

		/* --- NEW REALISTIC RULER PATTERN ---
		/* Layer 1: CM marks (Longest, Black) */
		/* Layer 2: 0.5 CM marks (Medium, Dark Grey) */
		/* Layer 3: MM marks (Shortest, Light Grey) */
		/* background-image:
			linear-gradient(90deg, #000 2px, transparent 2px),
			linear-gradient(90deg, #333 1px, transparent 1px),
			linear-gradient(90deg, #666 1px, transparent 1px); */

		/* Sizing matches CSS physical units */
		/* background-size: */
		/* 1cm 100%, */
		/* 1cm repeat */
		/* 0.5cm 60%, */
		/* 0.5cm repeat */
		/* 0.1cm 30%; */
		/* 1mm repeat */

		/* background-repeat: repeat-x; */
		/* background-position: bottom left; */

	}

	/* The drag handle */
	.tape-handle {
		position: absolute;
		left: 60px;
		top: 17px;
		width: 20px;
		height: 47px;
		background: #444;
		border-radius: 4px;
		cursor: col-resize;
		z-index: 15;
	}

	/* Hide the Internal Variable input field provided by SoSci */
	/* Replace 'IV01_01' below if your variable ID is different */
	#%userVar%,
	#%targetVar% {
		display: none;
	}

	/* --- MOBILE RESPONSIVE (VERTICAL VIEW) --- */
	@media (max-width: 600px) {
		.tape-container {
			width: 80px;
			/* Increased to take more space vertically */
			min-height: 500px;
			margin: 0.5rem auto 1rem;
		}

		.tape-housing {
			left: 17px;
			bottom: 0;
			top: auto;
			width: 47px;
			height: 60px;
			border-radius: 4px;
			/* Curve the top instead */
		}

		.tape-strip {
			left: 25px;
			bottom: 60px;
			/* Start right above the housing */
			top: auto;
			width: 30px;
			height: 0px;
			/* Height will be controlled by JS now */

			/* Rotate the ruler marks to point upwards from the bottom */
			/* background-image: */
			/* linear-gradient(0deg, #000 2px, transparent 2px), */
			/* linear-gradient(0deg, #333 1px, transparent 1px), */
			/* linear-gradient(0deg, #666 1px, transparent 1px); */

			/* Adjust background size to repeat safely upwards */
			/* background-size: */
			/* 100% 1cm, */
			/* 1cm repeat */
			/* 60% 0.5cm, */
			/* 0.5cm repeat */
			/* 30% 0.1cm; */
			/* 1mm repeat */

			/* background-repeat: repeat-y; */
			/* background-position: bottom left; */
			/* Crucial for keeping 0 at the housing level */
		}

		.tape-handle {
			left: 17px;
			bottom: 60px;
			top: auto;
			width: 47px;
			height: 20px;
			cursor: row-resize;
			/* Vertical resize cursor */
		}
	}
</style>

<div id="game-wrapper">
	<div class="tape-container" id="tape-interaction-area">
		<div class="tape-housing"></div>
		<div class="tape-strip" id="tape-strip"></div>
		<div class="tape-handle" id="tape-handle"></div>
	</div>

	<div style="font-size: 18px; margin: 1rem;">
		Please pull the tape measure to <b>exactly</b>: <b id="goal-display">...</b>
	</div>
</div>

<script>
	(function () {
		function getNextButton() {
			return document.getElementById("submit0") || document.getElementById("submitO") || document.querySelector("button[type='submit'], input[type='submit']");
		}

		// Wait for the page to load, then disable the Next button
		window.addEventListener("load", function () {
			let nextButton = getNextButton();
			if (nextButton) {
				nextButton.disabled = true;
			}
		});

		// --- CONFIGURATION ---
		// CHANGE THIS to your actual Internal Variable ID!
		const internalVarID = "%userVar%";
		// another internal variable ID to save dynamically generated goals:
		const goalVarID = "%targetVar%";
		const goalInput = document.getElementById(goalVarID);

		// Use fixed goal if configured via %goalMm%, otherwise generate one per trial.
		const goalDisplay = document.getElementById("goal-display");
		const configuredGoal = parseFloat("%goalMm%");
		const randomGoal = Math.floor(Math.random() * (120 - 5 + 1)) + 5;
		const targetGoal = Number.isFinite(configuredGoal) ? configuredGoal : randomGoal;
		if (goalDisplay) {
			goalDisplay.innerText = targetGoal + " mm";
		}
		if (goalInput) {
			goalInput.value = targetGoal;
		}


		// --- NEW DYNAMIC CALIBRATION ---
		// We create a temporary 1cm element to see how many pixels the browser uses for it.
		// Standard is usually ~37.8px on most screens unless zoomed.
		function getPixelsPerCm() {
			const div = document.createElement("div");
			div.style.width = "1cm";
			div.style.visibility = "hidden";
			document.body.appendChild(div);
			const px = div.offsetWidth;
			document.body.removeChild(div);
			return px;
		}

		console.log("Calculated px/cm:", getPixelsPerCm());

		const pixelsPerCm = getPixelsPerCm();
		const maxMm = parseFloat("%maxMm%") || 500; // Default to 500mm if not set
		// ---------------------

		const handle = document.getElementById("tape-handle");
		const tape = document.getElementById("tape-strip");
		const container = document.getElementById("tape-interaction-area"); // Select container

		// Use the native SoSci input
		const soSciInput = document.getElementById(internalVarID);

		let isDragging = false;
		let startX = 0;
		let startY = 0;
		let startVal = 0; // Agnostic variable combining startLeft / startTop
		const zeroOffset = 60; // Housing width

		// --- NEW: Detect screen orientation mode ---
		let isVertical = window.matchMedia("(max-width: 600px)").matches;
		let wasVertical = isVertical;

		// Listen for window resizes so it adapts live
		window.addEventListener('resize', () => {
			isVertical = window.matchMedia("(max-width: 600px)").matches;

			// Mobile browsers trigger 'resize' on scroll due to the address bar changing size.
			// Only reset style attributes if we actually changed from horizontal to vertical or vice versa.
			if (isVertical !== wasVertical) {
				handle.style.left = "";
				handle.style.top = "";
				handle.style.bottom = "";
				tape.style.width = "";
				tape.style.height = "";
				wasVertical = isVertical;
			}
		});

		function update(pageX, pageY) {
			if (!isDragging) return;

			// Check which axis we are using
			// When vertical, moving UP means pageY decreases, so startY - pageY is a positive growth
			const delta = isVertical ? (startY - pageY) : (pageX - startX);
			let newPixels = startVal + delta;

			// Calculate dynamic limit based on active axis
			const containerLimit = isVertical
				? container.offsetHeight - 60 - 20
				: container.offsetWidth - 60 - 20;

			// Limits
			if (newPixels < 0) newPixels = 0;

			// Stop at max mm OR the visual edge, whichever comes first
			const actualMax = Math.min((maxMm / 10) * pixelsPerCm, containerLimit);

			if (newPixels > actualMax) newPixels = actualMax;

			// Apply the CSS dynamically based on axis
			if (isVertical) {
				handle.style.bottom = zeroOffset + newPixels + "px";
				tape.style.height = newPixels + "px";
			} else {
				handle.style.left = zeroOffset + newPixels + "px";
				tape.style.width = newPixels + "px";
			}

			// Save data to SoSci variable as millimeters.
			if (soSciInput) {
				let mm = Math.round((newPixels / pixelsPerCm) * 10);
				soSciInput.value = mm;

				// LOGGING FOR VERIFICATION
				console.log(`Current raw pixels: ${newPixels.toFixed(2)}, Calculated mm: ${mm}mm`);

				const nextButton = getNextButton();
				if (nextButton) nextButton.disabled = false;
			}
		}

		// Mouse Events
		handle.addEventListener("mousedown", function (e) {
			isDragging = true;
			startX = e.pageX;
			startY = e.pageY;
			startVal = isVertical
				? (parseInt(handle.style.bottom) || zeroOffset) - zeroOffset
				: (parseInt(handle.style.left) || zeroOffset) - zeroOffset;
			e.preventDefault();
		});

		document.addEventListener("mouseup", () => (isDragging = false));
		document.addEventListener("mousemove", (e) => update(e.pageX, e.pageY));

		// Touch Events (Mobile support)
		handle.addEventListener(
			"touchstart",
			function (e) {
				isDragging = true;
				startX = e.touches[0].pageX;
				startY = e.touches[0].pageY;
				startVal = isVertical
					? (parseInt(handle.style.bottom) || zeroOffset) - zeroOffset
					: (parseInt(handle.style.left) || zeroOffset) - zeroOffset;
				e.preventDefault();
			},
			{ passive: false },
		);

		document.addEventListener("touchend", () => (isDragging = false));
		document.addEventListener("touchmove", (e) => update(e.touches[0].pageX, e.touches[0].pageY), {
			passive: false,
		});

	})();
</script>
